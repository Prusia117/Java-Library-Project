version: '3.9'

services:
  postgres:
    container_name: library-postgres-database
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydatabase
    ports:
      - "5420:5432"
    networks:
      - network_library
    volumes:
      - ./db_data:/var/lib/postgresql/data

  pgadmin:
    container_name: library-postgres-panel
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - network_library
    depends_on:
    - postgres

volumes:
  db_data:

networks:
  network_library:
    driver: bridge